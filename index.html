<title>One Bit</title>
<meta name="theme-color" content="#1A1B1F">
<meta name="apple-mobile-web-app-title" content="One Bit">

</head><body>
<style id="onebit-css">
/* Layout: uma coluna de app de celular (máx. 560px), estante em prateleiras, barra de abas fixa embaixo.
   Visual único escuro (grafite + roxo neon), com cores trocáveis pela tela Personalizar. */
:root{
  --bg:#1A1B1F; --surface:#24252A; --line:#34353C; --line2:#55545E; --wall:#202126;
  --fg:#F1F0F4; --soft:#CFCDD6; --muted:#A6A4AE; --ink:#141416;
  --accent:#B65CFF; --accent-rgb:182,92,255;
  --plank:#3A3B43; --plank-top:#4A4B54; --glow:16px; --cw:80px;
  --f-pixel:'Silkscreen',ui-monospace,'Courier New',monospace;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:560px;margin:0 auto;padding-block:20px 128px;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.px{font-family:var(--f-pixel);letter-spacing:.02em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:400 22px/1 var(--f-pixel);letter-spacing:1px}
.bit{width:14px;height:14px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.h-title{font:400 20px/1.15 var(--f-pixel)}
.icon-btn{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--line2)}
.bar{display:flex;align-items:center;gap:12px}

/* blocos comuns */
.card{background:var(--surface);border:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h2{font:400 14px/1.2 var(--f-pixel)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:14px;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn{min-height:48px;padding:0 18px;border:1px solid var(--fg);background:transparent;display:flex;align-items:center;justify-content:center;gap:8px;font:400 13px/1 var(--f-pixel);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 0 18px rgba(var(--accent-rgb),.35)}
.btn.ghost{border-color:var(--line);color:var(--soft);font:500 14px/1 var(--f-body)}
.btn.danger{border-color:#E06C75;color:#F2A3A9;font:500 14px/1 var(--f-body)}
.btn.small{min-height:36px;padding:0 12px;font:500 13px/1 var(--f-body)}
.btn.accent-line{border-color:var(--accent);color:var(--accent);font:500 14px/1 var(--f-body)}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.banner{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed var(--accent);background:rgba(var(--accent-rgb),.07)}
.banner p{font-size:14px;color:var(--soft)}
.empty{padding:28px 18px;text-align:center;border:1px dashed var(--line2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{color:var(--muted);font-size:14px;max-width:34ch}

/* perfil curto + números */
.me{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;flex:0 0 auto;background:var(--surface);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font:400 20px/1 var(--f-pixel);text-transform:uppercase}
.avatar.big{width:88px;height:88px;font-size:30px;border-width:3px;box-shadow:0 0 18px rgba(var(--accent-rgb),.45)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat b.hi{color:var(--accent)}
.stat span{font-size:11px;color:var(--muted)}

/* capas */
.cover{position:relative;width:var(--cw);aspect-ratio:2/3;background:var(--c,#3B3F52);overflow:hidden;border:1px solid rgba(255,255,255,.16);box-shadow:4px 0 8px rgba(0,0,0,.45);flex:0 0 auto;transition:transform .16s ease}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.achbar{height:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}.achbar span{display:block;height:100%;background:var(--accent)}
.achtog{width:100%;justify-content:center}
.cover i{position:absolute;width:20%;aspect-ratio:1}
.cover .p1{top:13%;left:18%;background:rgba(255,255,255,.8)}
.cover .p2{top:28%;left:38%;background:rgba(255,255,255,.4)}
.cover .p3{top:13%;left:58%;background:rgba(0,0,0,.25)}
.cover .badge{position:absolute;top:5px;right:5px;padding:2px 4px;font:400 max(8px,calc(var(--cw)*.1))/1.2 var(--f-pixel);background:var(--fg);color:var(--ink)}
.cover .ct{position:absolute;left:0;right:0;bottom:0;padding:5px;background:rgba(0,0,0,.66);font:400 max(8px,calc(var(--cw)*.1))/1.2 var(--f-pixel);color:#fff;text-align:left}
.cover.st-plat{border-color:var(--accent);box-shadow:0 0 var(--glow) rgba(var(--accent-rgb),.7),4px 0 8px rgba(0,0,0,.45)}
.cover.st-plat .badge{background:var(--accent)}
.cover.st-jogando .badge,.cover.st-zerado .badge{background:var(--bg);color:var(--fg)}

/* estante */
.shelf{display:flex;flex-direction:column;gap:10px}
.shelf .wall+.wall{margin-top:-10px}
.shelf-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.shelf-h h2{font:400 15px/1.2 var(--f-pixel)}
.shelf-h p{font-size:12px;color:var(--muted)}
.wall{background:var(--wall);box-shadow:inset 0 10px 18px rgba(0,0,0,.35)}
.row{display:flex;align-items:flex-end;gap:12px;padding:18px 14px 0;overflow:visible;min-height:calc(var(--cw) * 4 / 3 + 18px)}
.row .hint{align-self:center;color:var(--muted);font-size:13px;padding-bottom:14px}
.slot{background:none;border:0;padding:0;flex:0 0 auto;transition:opacity .16s ease}
.slot:hover .cover{transform:translateY(-3px)}
.slot.dim{opacity:.22}
.plank{height:12px;background:var(--plank);border-top:2px solid var(--plank-top);box-shadow:0 14px 16px -6px rgba(0,0,0,.65)}
[data-shelf="neon"] .plank{border-top-color:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.55),0 14px 16px -6px rgba(0,0,0,.65)}
.newshelf{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px dashed var(--line2)}
.newshelf h2{font:400 15px/1.2 var(--f-pixel)}
.newshelf p{font-size:13px;color:var(--muted)}

/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);min-width:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;font-size:14px;line-height:1.3}
.item .s{font-size:12px;color:var(--muted)}
.thumb{--cw:44px}
.tag{padding:3px 6px;font:400 10px/1.2 var(--f-pixel);border:1px solid var(--line2);color:var(--soft);white-space:nowrap}
.tag.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.add-btn{width:44px;height:44px;flex:0 0 auto;background:var(--accent);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center}
.check{width:26px;height:26px;flex:0 0 auto;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.troph-ico{width:36px;height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--line)}
.troph-ico.platina{background:var(--accent);color:var(--ink)}
.troph-ico.ouro{background:#C9A227;color:var(--ink)}
.troph-ico.prata{background:#A9AEB8;color:var(--ink)}
.troph-ico.bronze{background:#B0703F;color:var(--ink)}
.troph-ico.conquista,.troph-ico.meta{background:var(--accent);color:var(--ink)}
.grp{display:flex;flex-direction:column}
.grp-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--soft);padding:8px 0;cursor:pointer;list-style:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);margin-left:8px}
details.grp[open]>summary::after{content:"−"}
details.grp[open]>summary{margin-bottom:6px}
.grp.off,.dlc.off{opacity:.38;filter:grayscale(1)}
.dlcs{display:flex;flex-direction:column;gap:8px}
.dlc{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.dlc .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dlc .t{font-weight:600;font-size:14px}
.dlc .s{font-size:12px;color:var(--muted)}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--soft);min-width:0}
.input,.select,.textarea{min-height:46px;padding:0 12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-size:16px;width:100%;box-sizing:border-box;min-width:0}
.textarea{padding:10px 12px;min-height:96px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.22)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px}
.diff{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.diff button{height:30px;border:0;background:var(--line);padding:0}
.diff button[aria-pressed="true"]{background:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);background:transparent;font-size:18px}
.stepper b{min-width:64px;text-align:center;font:500 16px/1 var(--f-mono);color:var(--accent)}
.cover-pick{display:flex;gap:14px;align-items:flex-start}
.cover-pick .cover{--cw:110px}
.trow{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--line)}
.trow .line{display:flex;gap:8px;align-items:center}
.trow .input{min-height:40px;font-size:15px}
.trow .select{min-height:40px;width:auto;font-size:14px}
.switch{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.switch .grow{flex:1;display:flex;flex-direction:column;gap:3px}
.switch .grow small{color:var(--muted);font-size:12px}
.track{width:48px;height:28px;flex:0 0 auto;padding:3px;box-sizing:border-box;background:var(--line);display:flex}
.track span{width:22px;height:22px;background:var(--muted)}
.switch[aria-pressed="true"] .track{background:var(--accent);justify-content:flex-end}
.switch[aria-pressed="true"] .track span{background:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:44px;height:44px;border:2px solid transparent;padding:0;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 12px var(--c)}
.colorpick{width:44px;height:44px;padding:0;border:1px dashed var(--line2);background:transparent}
.range{width:100%;accent-color:var(--accent)}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.pastebox{min-height:44px;height:44px;padding:10px 12px;font-size:14px;resize:none;border-style:dashed;line-height:1.4}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}

/* página do jogo */
.c3d-wrap{display:flex;justify-content:center;padding:18px 0 34px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.c3d{--cw:min(240px,62vw);position:relative;width:var(--cw);aspect-ratio:2/3;background:var(--c);overflow:hidden;border:2px solid var(--line2);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out,box-shadow .15s ease-out;box-shadow:var(--sh,0 22px 34px rgba(0,0,0,.6))}
.c3d.st-plat{border-color:var(--accent);box-shadow:var(--sh,0 22px 34px rgba(0,0,0,.6)),0 0 32px rgba(var(--accent-rgb),.45)}
.c3d img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c3d i{position:absolute;width:20%;aspect-ratio:1}
.c3d .p1{top:11%;left:15%;background:rgba(255,255,255,.8)}
.c3d .p2{top:26%;left:35%;background:rgba(255,255,255,.4)}
.c3d .p3{top:11%;left:55%;background:rgba(0,0,0,.25)}
.c3d .badge{position:absolute;top:10px;right:10px;padding:4px 8px;font:400 11px/1.2 var(--f-pixel);background:var(--fg);color:var(--ink)}
.c3d.st-plat .badge{background:var(--accent)}
.c3d .ct{position:absolute;left:0;right:0;bottom:0;padding:12px;background:rgba(0,0,0,.6);font:400 13px/1.25 var(--f-pixel);color:#fff}
.c3d .shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,40%) var(--gy,30%),rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.c3d{transition:none;will-change:transform;transform-style:preserve-3d}
.c3d::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -40px 60px -40px rgba(0,0,0,.45)}
.c3d .shine{mix-blend-mode:screen}
.c3d-wrap:active{cursor:grabbing}
@keyframes sway{0%,100%{transform:perspective(900px) rotateX(-4deg) rotateY(-10deg)}50%{transform:perspective(900px) rotateX(3deg) rotateY(10deg)}}
.badge-st{align-self:flex-start;padding:4px 8px;font:400 11px/1.2 var(--f-pixel);background:var(--fg);color:var(--ink)}
.badge-st.plat{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .meter{height:10px;background:var(--line)}
.prog .meter span{display:block;height:100%;background:var(--accent)}
.ficha{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.ficha div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-bottom:1px solid var(--line)}
.ficha div:last-child{border-bottom:0}
.ficha dt{font-size:13px;color:var(--muted)}
.ficha dd{margin:0;font-size:14px;text-align:right}
.ficha dd.mono{font-size:14px}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-right:8px}
.dots i{width:6px;height:14px;background:var(--line)}
.dots i.on{background:var(--accent)}
.prints{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shot{position:relative;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:6px;right:6px;width:36px;height:36px;background:rgba(0,0,0,.7);border:0;color:#fff;display:flex;align-items:center;justify-content:center}
.shot-add{aspect-ratio:16/9;border:1px dashed var(--accent);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;cursor:pointer;background:transparent}
.story{font-size:15px;line-height:1.6;color:var(--soft);white-space:pre-wrap;max-width:65ch}

/* perfil */
.profile-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.vitrine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.vitrine .slot{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;color:var(--soft);font-size:12px}
.vitrine .cover{--cw:100%;width:100%}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:13px}
.bar-row .tr{display:flex;height:14px;background:var(--surface)}
.bar-row .tr span:first-child{background:var(--accent)}
.bar-row .tr span:last-child{background:var(--fg)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:14px}
.tl .dot{width:14px;height:14px;background:var(--fg);flex:0 0 auto}
.tl .dot.plat{background:var(--accent)}
.tl .ln{flex:1;width:2px;background:var(--line);min-height:28px}
.tl .body{display:flex;flex-direction:column;gap:2px;padding-bottom:16px;min-width:0}

/* barra de abas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--muted);font-size:11px;min-height:52px}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--ink);padding:10px 16px;font-size:14px;max-width:calc(100% - 48px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.86);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet img{display:block;width:100%;max-height:60vh;object-fit:contain;background:#000}
.loading{display:flex;flex-direction:column;gap:14px;padding-top:40px}
.loading .ph{height:150px;background:var(--wall);position:relative}
.loading .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--plank);border-top:2px solid var(--plank-top)}
@media (prefers-reduced-motion:reduce){.c3d-wrap.idle .c3d{animation:none}.c3d,.cover,.slot{transition:none}}

/* ---------- identidade visual (artes em pixel art) ---------- */
.brand .logo{width:30px;height:30px;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),.55))}
.brand .word{text-shadow:0 0 14px rgba(var(--accent-rgb),.55)}
.hero{position:relative;border:1px solid var(--line);background:var(--surface) var(--hero) center 30%/cover no-repeat;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero{padding-top:72px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,0) 0%,rgba(20,20,22,.35) 35%,rgba(20,20,22,.88) 75%,var(--bg) 100%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);pointer-events:none;opacity:.5}
.hero>*{position:relative;z-index:1}
.hero .stat{background:rgba(26,27,31,.72);backdrop-filter:blur(2px)}
.hero.center{align-items:center;text-align:center}
.cover img.medal{position:absolute;inset:auto;top:-7px;right:-7px;left:auto;bottom:auto;width:max(22px,calc(var(--cw)*.3));height:auto;object-fit:contain;z-index:2;image-rendering:pixelated;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7));pointer-events:none}
.c3d img.medal{position:absolute;inset:auto;top:-18px;right:-18px;left:auto;bottom:auto;width:76px;height:auto;object-fit:contain;z-index:3;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));transform:translateZ(30px);pointer-events:none}
.badge-st{display:inline-flex;align-items:center;gap:6px}
.badge-st img{width:20px;height:20px;image-rendering:pixelated;margin:-4px 0 -4px -4px}
.empty .art{width:150px;height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 18px rgba(var(--accent-rgb),.25))}
.cover.st-plat{animation:neon 3.2s ease-in-out infinite}
@keyframes neon{0%,100%{box-shadow:0 0 var(--glow) rgba(var(--accent-rgb),.55),4px 0 8px rgba(0,0,0,.45)}50%{box-shadow:0 0 calc(var(--glow) * 1.8) rgba(var(--accent-rgb),.9),4px 0 8px rgba(0,0,0,.45)}}
#app.enter{animation:enter .28s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.slot .cover{transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s}
.slot:hover .cover,.slot:focus-visible .cover{transform:translateY(-6px) rotate(-1deg)}
.cover,.c3d{overflow:visible}
.thumb .cover img.medal{display:none}
.row{padding-top:22px}
.wall{background:linear-gradient(180deg,rgba(var(--accent-rgb),.06),transparent 40%),var(--wall)}
.plank{box-shadow:0 -1px 0 rgba(var(--accent-rgb),.35),0 6px 14px rgba(0,0,0,.45)}
.btn.primary{box-shadow:0 0 0 rgba(var(--accent-rgb),0);transition:box-shadow .2s,transform .1s}
.btn.primary:hover{box-shadow:0 0 18px rgba(var(--accent-rgb),.55)}
.btn:active{transform:translateY(1px)}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.8))}
.celebrate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 42%,rgba(var(--accent-rgb),.32),rgba(20,20,22,.98) 62%),var(--bg);text-align:center;padding:24px;cursor:pointer;animation:fadein .25s ease}
.celebrate .big{width:min(52vw,220px);image-rendering:pixelated;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,float 2.6s ease-in-out .7s infinite;filter:drop-shadow(0 0 28px rgba(var(--accent-rgb),.9))}
.celebrate h2{font:400 30px/1.1 var(--f-pixel);letter-spacing:2px;text-shadow:0 0 18px rgba(var(--accent-rgb),.9);animation:pop .6s .15s cubic-bezier(.2,1.6,.4,1) both}
.celebrate p{color:var(--soft);font-size:15px;max-width:30ch}
.celebrate small{color:var(--muted);font-size:12px;margin-top:8px}
.celebrate i{position:absolute;width:8px;height:8px;background:var(--accent);box-shadow:0 0 8px var(--accent);top:45%;left:50%;animation:burst 1.4s cubic-bezier(.1,.8,.3,1) forwards;opacity:0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@media (prefers-reduced-motion:reduce){#app.enter,.cover.st-plat,.celebrate .big,.celebrate h2,.celebrate i{animation:none!important}.celebrate i{display:none}}

/* ---------- coleção / progressão de conquistas ---------- */
:root{--gold:#E8B84A;--gold-ink:#2A1E05}
.pmeters{display:grid;gap:8px}
.pm{border:1px solid var(--line);background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.pm b{font-weight:600;font-size:15px;color:var(--fg)}
.pm .pach{grid-column:1/-1;display:inline-flex;align-items:center;gap:6px;font:400 10px var(--f-pixel);letter-spacing:1px;color:var(--accent);margin-top:-2px}
.pm.gold .pach{color:var(--gold)}
.pm .pach svg{width:12px;height:12px;flex:0 0 auto}
.pm .num{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--soft)}
.pm .req{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.pm .achbar{grid-column:1/-1}
.pm.gold .achbar span{background:var(--gold)}
.pm.done{border-color:var(--accent);box-shadow:0 0 14px rgba(var(--accent-rgb),.3)}.pm.done .num{color:var(--accent)}
.pm.gold.done{border-color:var(--gold);box-shadow:0 0 14px rgba(232,184,74,.28)}.pm.gold.done .num{color:var(--gold)}
.ptabs{display:flex;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{all:unset;cursor:pointer;flex:1 0 auto;white-space:nowrap;text-align:center;padding:12px 12px;font:400 11px var(--f-pixel);letter-spacing:1px;color:var(--muted);border-right:1px solid var(--line)}
.ptabs button:last-child{border-right:0}
.ptabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.prow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px 7px 10px;background:var(--surface);border:1px solid var(--line)}
.prow .pn{font:500 12px var(--f-mono);color:var(--muted)}
.prow .pnm b{display:block;font-weight:600;overflow-wrap:anywhere}
.prow.off .pnm b{color:var(--muted)}
.prow.gold{border-color:rgba(232,184,74,.55)}
.ptog{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);color:var(--muted)}
.ptog svg{width:21px;height:21px}
.ptog[aria-pressed="true"].d{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.ptog[aria-pressed="true"].g{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ptog:focus-visible,.ptabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ptogs{display:flex;gap:6px}
.rar{display:inline-block;margin-top:2px;font:400 9px var(--f-pixel);letter-spacing:1px;padding:2px 5px;border:1px solid currentColor}
.rar.C{color:#5AA9FF}.rar.U{color:#3FCB7A}.rar.R{color:#FF5A5A}.rar.L{color:#C98BFF}
.plegend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.plegend i{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;margin-right:6px;vertical-align:middle}
.plegend i svg{width:14px;height:14px}
.plegend .ld{background:var(--accent);color:var(--ink)}.plegend .lg{background:var(--gold);color:var(--gold-ink)}
details.pcat{border:1px solid var(--line);background:var(--surface)}
details.pcat>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;align-items:center}
details.pcat>summary::-webkit-details-marker{display:none}
details.pcat>summary b{font:400 12px var(--f-pixel);letter-spacing:1px}
details.pcat>summary .achbar{grid-column:1/-1;height:5px}
details.pcat[open]>summary{border-bottom:1px solid var(--line)}
.pcatbody{padding:8px;display:flex;flex-direction:column;gap:6px}
.pcatbody .prow{background:var(--bg)}
.plink{all:unset;cursor:pointer;font-size:13px;color:var(--accent);padding:4px 0;align-self:flex-start}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 12px}.pbar i{display:block;height:100%;background:var(--accent,#B65CFF);transition:width .3s}
.warn{color:#FFB4A8}
.trbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:10px 0}.s.orig{display:block;opacity:.6;font-size:11px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:-4px 0 12px}.fpanel{border:1px solid var(--line,rgba(255,255,255,.1));border-radius:12px;padding:12px 14px;margin:0 0 16px}.fpanel h3{font:600 11px/1.2 var(--mono,monospace);letter-spacing:.8px;margin:12px 0 8px}.fpanel h3:first-child{margin-top:0}.slot{position:relative}.fbadge{position:absolute;left:4px;right:4px;bottom:4px;z-index:3;text-align:center;font:600 11px/1.6 var(--mono,monospace);color:#fff;background:rgba(18,18,22,.86);border:1px solid var(--accent,#B65CFF);border-radius:6px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

function normalize(raw){

    const g=Object.assign(blankGame(),games[k]); g.id=k;

function packState(data){Object.values(data.games||{}).forEach(g=>{delete g.guide;const def=isPS(g.platform)?'bronze':'conquista';
  g.trophies=(g.trophies||[]).map(t=>{const o={name:t.name};if(t.desc)o.desc=t.desc;if(t.type&&t.type!==def)o.type=t.type;if(t.done)o.done=1;if(t.dlc)o.dlc=t.dlc;return o});
  g.dlcs=(g.dlcs||[]).map(d=>{const o={id:d.id,name:d.name};if(d.kind&&d.kind!=='outro')o.kind=d.kind;if(d.owned)o.owned=1;if(d.included)o.included=1;if(d.via)o.via=d.via;if(d.noAchievements)o.noAchievements=1;if(d.price!=null)o.price=d.price;return o})});return data}

// banco: dados gerais em data/users/<id>/library e cada jogo em .../library/games/<id> (cada registro tem limite de 256 KB)
async function saveNow(){
  const data=packState(clone(S)); data.savedAt=new Date().toISOString();
  try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){if(store.mode!=='db')toast('O armazenamento deste navegador está cheio. Exporte um backup.')}
  if(!store.ref)return;
  if(store.saving){store.again=true;return}
  store.saving=true;
  const games=data.games||{}; delete data.games; delete data.media; delete data.savedAt;
  let failed=null;
  const put=async(fn)=>{try{await fn()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await fn()}catch(e2){failed=e2}}else failed=e}};
  const meta=JSON.stringify(data);
  if(meta!==store.lastMeta){await put(()=>store.ref.set(Object.assign({},data,{split:2,savedAt:new Date().toISOString()})));if(!failed)store.lastMeta=meta}
  for(const [id,g] of Object.entries(games)){const js=JSON.stringify(g);if(store.lastG[id]===js)continue;const f0=failed;await put(()=>store.gcol.doc(id).set(g));if(failed===f0)store.lastG[id]=js}
  for(const id of Object.keys(store.lastG)){if(!games[id]){const f0=failed;await put(()=>store.gcol.doc(id).delete());if(failed===f0)delete store.lastG[id]}}
  store.saving=false;
  if(failed){const c=failed.code;toast(c==='invalid_argument'?'Um jogo ficou grande demais para salvar. Troque capas e prints grandes por imagens menores.':c==='quota_exceeded'?'O espaço do banco do app acabou. Apague jogos que não usa ou exporte um backup.':'Não consegui salvar agora. Suas mudanças estão guardadas neste aparelho.')}
  if(store.again){store.again=false;saveNow()}
}
async function boot(){
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  const seed=window.ONEBIT_SEED;
  if(seed&&seed.games&&(!cached||!cached.savedAt||(seed.exportedAt||'')>cached.savedAt))cached=seed;
  if(cached&&cached.games){S=normalize(cached);applyTheme();render()}
  const fallback=setTimeout(()=>{if(!S){S=sampleState();applyTheme();render()}},3000);
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  try{
    const [db,user]=use?await Promise.all([use('db'),use('user')]):[null,null];
    const uid=user?await user.id():null;store.uid=uid;
    store.db=db||null; try{store.isOwner=user?!!(await user.isOwner()):false}catch(e){store.isOwner=false}
    if(db&&uid){
      store.ref=db.doc('data/users/'+uid+'/library'); store.mode='db';
      store.gcol=db.collection('data/users/'+uid+'/library/games'); store.lastG={}; store.lastMeta=null;
      const [snap,gs]=await Promise.all([store.ref.get(),store.gcol.limit(1000).get()]);
      const fromCol={}; gs.docs.forEach(d=>{fromCol[d.id]=clone(d.data())});
      if(snap.exists||gs.docs.length){
        const meta=snap.exists?clone(snap.data()):{}; const legacy=meta.games||null;
        meta.games=Object.assign({},legacy||{},fromCol);
        S=normalize(meta);
        // marca como já salvo o que veio do banco, para não regravar tudo
        const packed=packState(clone(S)); Object.keys(fromCol).forEach(id=>{if(packed.games[id])store.lastG[id]=JSON.stringify(packed.games[id])});
        if(!legacy){const m=clone(packed);delete m.games;delete m.media;delete m.savedAt;store.lastMeta=JSON.stringify(m)}
        if(legacy)save(); // converte a estante antiga (tudo num registro só)
      }
      else if(S&&cached){save()}
      else if(!S){S=sampleState()}
    }else{store.mode='local'}
  }catch(e){store.mode='local'}
  clearTimeout(fallback);
  if(!S)S=sampleState();
  if(use){
    try{store.assets=await use('assets')}catch(e){}
    try{store.downloads=await use('downloads')}catch(e){}
    try{store.mcp=await use('mcp')}catch(e){store.mcp=null}
    try{store.sample=await use('sample')}catch(e){store.sample=null}
  }
  if(store.db&&store.isOwner)loadCatalog();
  applyTheme();render();
}

async function capaFlush(){
  const ids=[...capaQueue];capaQueue=new Set();if(!ids.length)return;
  let found={};
  const br=(typeof bridgeURL==='function')?bridgeURL():'';
  if(br){try{for(let i=0;i<ids.length;i+=50){const r=await fetch(br+'/capa?appids='+ids.slice(i,i+50).join(','),{cache:'no-store'});if(r.ok){const j=await r.json();Object.assign(found,j.capas||{})}}}catch(e){}}
  ids.forEach(a=>{if(found[a])CAPAFIX[a]=found[a];else CAPATMP[a]='https://shared.steamstatic.com/store_item_assets/steam/apps/'+a+'/header.jpg'});
  capaSave();capaRerender();
}
function coverSrc(g){const off=location.protocol==='file:';if(g.coverId&&((S&&S.media&&S.media[g.coverId])||!off))return mediaSrc(g.coverId);if(g.coverData)return g.coverData;if(!g.coverPath)return null;const m=S&&S.media&&S.media[g.coverPath];if(m)return m;const a=steamAppOf(g.coverPath);return (a&&(CAPAFIX[a]||CAPATMP[a]))||g.coverPath}
document.addEventListener('error',e=>{const t=e.target;if(!(t&&t.tagName==='IMG'&&t.closest&&t.closest('.cover,.c3d')))return;
  const src=t.getAttribute('src')||'',a=steamAppOf(src);
  if(a&&!capaTried.has(a)&&CAPAFIX[a]!==src&&!/header\.jpg/.test(src)){capaTried.add(a);capaQueue.add(a);clearTimeout(capaTimer);capaTimer=setTimeout(capaFlush,300);}
  else if(a&&CAPAFIX[a]===src&&!/header\.jpg/.test(src)){delete CAPAFIX[a];capaSave();CAPATMP[a]='https://shared.steamstatic.com/store_item_assets/steam/apps/'+a+'/header.jpg';capaRerender()}
  t.remove()},true);

function prog(g){
  if(g.noAchievements)return null;
  const usesDlc=g.trophies.some(t=>t.dlc&&dlcById(g,t.dlc));
  const rel=g.trophies.filter(t=>!t.dlc||(dlcById(g,t.dlc)||{owned:true}).owned);
  const done=rel.filter(t=>t.done).length, total=usesDlc?rel.length:(+g.trophyTotal||g.trophies.length||0);
  if(g.status==='plat'||g.status==='cem')return {pct:100,label:total?total+'/'+total+' · 100%':'100%'};
  if(!total)return null;

  return {pct,label:done+'/'+total+' · '+pct+'%'};
}

const GT_LANG={'pt-BR':'pt','en':'en','es':'es'};
async function gtOne(text,tl){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+tl+'&dt=t&q='+encodeURIComponent(text));
  if(!r.ok)throw new Error('gt '+r.status);const j=await r.json();
  return (j&&j[0]||[]).map(x=>x&&x[0]||'').join('');
}
async function gtList(texts,tl){
  const out=new Array(texts.length).fill('');const idx=texts.map((t,i)=>t?i:-1).filter(i=>i>=0);
  let i=0;
  while(i<idx.length){
    const chunk=[];let len=0;
    while(i<idx.length&&(len+texts[idx[i]].length<3500||!chunk.length)){chunk.push(idx[i]);len+=texts[idx[i]].length+1;i++}
    const res=await gtOne(chunk.map(k=>texts[k].replace(/\n/g,' ')).join('\n'),tl);
    const parts=res.split('\n');
    if(parts.length===chunk.length)chunk.forEach((k,j)=>out[k]=parts[j].trim());
    else for(const k of chunk)out[k]=(await gtOne(texts[k],tl)).trim();
  }
  return out;
}
async function translateLocal(g,L){
  const T=self.Translator;if(!T||!T.create)throw new Error('no local');
  const tl=GT_LANG[L],sl=tl==='en'?'pt':'en';
  const av=await T.availability({sourceLanguage:sl,targetLanguage:tl});if(av==='unavailable')throw new Error('no local');
  const tr=await T.create({sourceLanguage:sl,targetLanguage:tl});
  const one=async x=>x?(await tr.translate(x)).trim():'';
  const out=[];for(const t of g.trophies)out.push({n:(await one(t.name))||t.name||'',d:(await one(t.desc))||t.desc||''});
  try{tr.destroy&&tr.destroy()}catch(e){}
  return out;
}
async function translateGoogle(g,L){
  const tl=GT_LANG[L];
  const names=await gtList(g.trophies.map(t=>t.name||''),tl);
  const descs=await gtList(g.trophies.map(t=>t.desc||''),tl);
  return g.trophies.map((t,i)=>({n:names[i]||t.name||'',d:descs[i]||t.desc||''}));
}
async function translateTrophies(g,useClaude){
  const L=curLang();
  if(g.tr&&g.tr.lang===L&&g.tr.sig===trSig(g)){UI.trShow[g.id]=true;render();return}
  UI.trBusy=g.id;UI.trFail=null;render();
  if(!useClaude){
    let items=null,by='google';
    try{items=await translateGoogle(g,L)}catch(e){try{items=await translateLocal(g,L);by='local'}catch(e2){}}
    if(items){g.tr={lang:L,sig:trSig(g),items,by};UI.trShow[g.id]=true;save()}else UI.trFail=g.id;
    UI.trBusy=null;render();return;
  }
  if(!store.sample){UI.trBusy=null;render();toast('A tradução pelo Claude só funciona com o One Bit aberto no Claude.');return}
  try{
    const items=[],src=g.trophies.map(t=>({n:t.name||'',d:t.desc||''}));
    for(let i=0;i<src.length;i+=60){
      const chunk=src.slice(i,i+60);
      const out=await store.sample.json('You translate video game achievement names and descriptions into '+LANG_FULL[L]+'. Game: "'+g.title+'".\nRules: keep proper nouns, character names, item names and numbers as players of that language know them; keep it short and natural, like an official localization; if a text is already in '+LANG_FULL[L]+', return it unchanged; never add explanations.\nReturn ONLY a JSON array with exactly '+chunk.length+' objects in the same order, each {"n": translated name, "d": translated description}.\n\nInput:\n'+JSON.stringify(chunk),{modelTier:'quick'});
      if(!Array.isArray(out)||out.length!==chunk.length)throw {code:'shape'};
      out.forEach(o=>items.push({n:String(o&&o.n||'').trim(),d:String(o&&o.d||'').trim()}));
    }
    items.forEach((it,i)=>{if(!it.n)it.n=src[i].n;if(!it.d&&src[i].d)it.d=src[i].d});
    g.tr={lang:L,sig:trSig(g),items,by:'claude'};UI.trShow[g.id]=true;save();
  }catch(e){const c=e&&e.code;toast(c==='not_granted'?'Permita o uso do Claude para traduzir.':c==='rate_limited'?'Muitas traduções seguidas. Tente de novo em instantes.':'Não consegui traduzir agora. Tente de novo.')}
  UI.trBusy=null;render();
}

function gGenres(g){const m=GENRE_MAP[String(g.steamAppId||'')]||'';return Array.from(new Set(m.split('').map(c=>GENRES[c.charCodeAt(0)-97]).concat(g.genres||[]).filter(Boolean)))}

const achKey=t=>String(t||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').replace(/[\s.!…]+$/,'').trim();
function applyAch(g,list){
  if(!list.length)return {n:0,matched:0};
  if(!g.trophies.length){
    g.trophies=list.map(a=>({name:a.name||a.nameEn||a.api,desc:a.desc||'',type:'conquista',done:!!a.achieved,dlc:''}));
    g.trophyTotal=list.length;g.noAchievements=false;
    return {n:list.filter(a=>a.achieved).length,matched:list.length,filled:true};
  }
  const got=new Set();list.forEach(a=>{if(a.achieved){got.add(achKey(a.name));got.add(achKey(a.nameEn))}});got.delete('');
  const known=new Set();list.forEach(a=>{known.add(achKey(a.name));known.add(achKey(a.nameEn))});
  let n=0,matched=0;
  g.trophies.forEach(t=>{const k=achKey(t.name);if(known.has(k))matched++;if(!t.done&&got.has(k)){t.done=true;n++}});
  return {n,matched};
}

/* ---------- organização automática da estante ---------- */
const ORG_CRITS=[['franquia','Franquia'],['genero','Gênero'],['status','Progresso'],['plataforma','Plataforma'],['decada','Década'],['dev','Desenvolvedora']];
const ORG_STATUS={plat:'Platinados',cem:'100%',zerado:'Zerados',jogando:'Jogando agora'};
function orgCatOf(g){if(!g.baseId||!Array.isArray(CAT))return null;return CAT.find(c=>c.id===g.baseId)||null}
function orgTitleKey(t){
  t=String(t||'').replace(/[™®©]/g,'').replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim();
  if(/^LEGO\b/i.test(t))return 'LEGO';
  let m=/^(.{3,60}?)\s*(?::|\s[-–—]\s)/.exec(t);if(m)t=m[1].trim();
  m=/^(.{3,60}?)\s+(?:\d+|I{2,3}|IV|VI{0,3}|IX|X)\b/.exec(t);if(m)t=m[1].trim();
  return t.replace(/\s+(?:\d+|I{2,3}|IV|VI{0,3}|IX|X)$/,'').trim();
}
function orgKeys(g,crit){
  const c=orgCatOf(g);
  switch(crit){
    case 'franquia':{const f=g.franchise||(c&&c.franchise)||'';return [f||orgTitleKey(g.title)]}
    case 'genero':{const gs=gGenres(g);return gs.length?[gs[0]]:[]}
    case 'status':return [ORG_STATUS[g.status]||'Na fila']
    case 'plataforma':return [g.platform||'Sem plataforma']
    case 'decada':{const y=parseInt(g.year||(c&&c.year)||'',10);return y>1970?[String(Math.floor(y/10)*10)+'s']:[]}
    case 'dev':{const d=g.developer||(c&&c.developer)||'';return d?[d.split(',')[0].trim()]:[]}
  }
  return [];
}
function orgPlan(crit){
  const games=Object.values(S.games),groups={},rest=[];
  const label={};
  games.forEach(g=>{const raw=orgKeys(g,crit)[0];if(!raw){rest.push(g);return}const k=raw.toLowerCase();if(!label[k])label[k]=raw;(groups[k]=groups[k]||[]).push(g)});
  if(crit==='franquia'){
    const keys=Object.keys(groups).sort((a,b)=>a.length-b.length);
    keys.forEach(k=>{if(!groups[k])return;keys.forEach(l=>{if(l!==k&&groups[l]&&l.startsWith(k+' ')&&k.length>=4){groups[k]=groups[k].concat(groups[l]);delete groups[l]}})});
    const two=k=>k.split(' ').slice(0,2).join(' ');
    Object.keys(groups).forEach(k=>{if(!groups[k]||groups[k].length>1||k.split(' ').length<3)return;const p=two(k);
      const mates=Object.keys(groups).filter(l=>l!==k&&groups[l]&&two(l)===p&&l.split(' ').length>=2);
      if(mates.length){const all=[k].concat(mates).reduce((a,x)=>a.concat(groups[x]),[]);[k].concat(mates).forEach(x=>delete groups[x]);groups[p]=(groups[p]||[]).concat(all);
        if(!label[p]){const src=label[k]||k;label[p]=src.split(' ').slice(0,2).join(' ')}}});
  }
  const keepAll=crit==='status'||crit==='plataforma'||crit==='decada';
  let shelves=[];
  Object.entries(groups).forEach(([k,gs])=>{if(keepAll||gs.length>=2)shelves.push({name:label[k],games:gs});else rest.push(...gs)});
  if(crit==='status'){const order=['Platinados','100%','Zerados','Jogando agora','Na fila'];shelves.sort((a,b)=>order.indexOf(a.name)-order.indexOf(b.name))}
  else if(crit==='decada')shelves.sort((a,b)=>b.name.localeCompare(a.name));
  else shelves.sort((a,b)=>b.games.length-a.games.length||a.name.localeCompare(b.name,'pt-BR'));
  shelves.forEach(x=>x.games.sort((a,b)=>String(a.title).localeCompare(String(b.title),'pt-BR')));
  if(rest.length)shelves.push({name:'Outros',games:rest.sort((a,b)=>String(a.title).localeCompare(String(b.title),'pt-BR')),other:true});
  return shelves;
}
function orgApply(crit){

/* ---------- card 3D ---------- */
/* Física de mola: o card segue o dedo, volta ao centro balançando de leve ao soltar e,
   depois de parado, começa a flutuar devagar. Nada salta de posição. */
let tiltRAF=0;
function attachTilt(){
  cancelAnimationFrame(tiltRAF);
  const wrap=document.getElementById('c3d'); if(!wrap)return;
  const card=wrap.firstElementChild, MAX=24;
  const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  const now0=performance.now();
  const st={rx:-4,ry:8,vx:0,vy:0,s:1,vs:0,tx:0,ty:0,drag:false,hover:false,sx:0,sy:0,bx:0,by:0,rest:now0,blend:0,last:now0};
  const clamp=(v,m)=>Math.max(-m,Math.min(m,v));
  wrap.addEventListener('pointerdown',e=>{st.drag=true;st.sx=e.clientX;st.sy=e.clientY;st.bx=st.rx;st.by=st.ry;st.tx=st.rx;st.ty=st.ry;st.blend=0;try{wrap.setPointerCapture(e.pointerId)}catch(_){}});
  wrap.addEventListener('pointermove',e=>{
    if(st.drag){st.ty=clamp(st.by+(e.clientX-st.sx)*0.32,MAX);st.tx=clamp(st.bx-(e.clientY-st.sy)*0.32,MAX);st.rest=performance.now()}
    else if(e.pointerType==='mouse'){const r=wrap.getBoundingClientRect();st.hover=true;st.blend=0;st.ty=clamp(((e.clientX-r.left)/r.width-.5)*2*MAX*.8,MAX);st.tx=clamp(-((e.clientY-r.top)/r.height-.5)*2*MAX*.8,MAX);st.rest=performance.now()}
  });
  const end=()=>{if(!st.drag&&!st.hover)return;st.drag=false;st.hover=false;st.tx=0;st.ty=0;st.rest=performance.now()};
  ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(n=>wrap.addEventListener(n,end));
  const step=now=>{
    if(!card.isConnected)return;
    const dt=Math.min(0.033,Math.max(0,(now-st.last)/1000)); st.last=now;
    let tx=st.tx, ty=st.ty;
    if(!st.drag&&!st.hover&&!reduce){
      if(now-st.rest>1600)st.blend=Math.min(1,st.blend+dt*0.35);
      const t=now/1000; tx+=Math.sin(t*0.8)*4*st.blend; ty+=Math.sin(t*0.55+1.3)*10*st.blend;
    }
    const ts=st.drag?1.045:1;
    if(reduce){st.rx=tx;st.ry=ty;st.s=ts}
    else{
      const k=150,c=17;
      st.vx+=(k*(tx-st.rx)-c*st.vx)*dt; st.vy+=(k*(ty-st.ry)-c*st.vy)*dt;
      st.rx+=st.vx*dt; st.ry+=st.vy*dt;
      st.vs+=(220*(ts-st.s)-22*st.vs)*dt; st.s+=st.vs*dt;
    }
    card.style.transform='perspective(1000px) rotateX('+st.rx.toFixed(2)+'deg) rotateY('+st.ry.toFixed(2)+'deg) scale('+st.s.toFixed(4)+')';
    card.style.setProperty('--gx',(50+st.ry*2.4).toFixed(1)+'%');
    card.style.setProperty('--gy',(40-st.rx*2.4).toFixed(1)+'%');
    card.style.setProperty('--sh',(-st.ry*0.9).toFixed(1)+'px '+(st.rx*0.9+24).toFixed(1)+'px '+(34+(st.s-1)*500).toFixed(0)+'px rgba(0,0,0,.6)');
    tiltRAF=requestAnimationFrame(step);
  };
  tiltRAF=requestAnimationFrame(step);
}

async function shrink(file,max){

}

function wrapLines(x,text,maxW,maxLines){
  const words=String(text).split(/\s+/), lines=[]; let cur='';

  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…'}
  return lines;
}

   org:async()=>{UI.org={crit:(S.collections.find(c=>c.auto)||{}).auto||'franquia'};renderOverlay();if(!Array.isArray(CAT)){try{await loadCatalog()}catch(e){}if(UI.org)renderOverlay()}},

  newcoll:()=>{const i=document.getElementById('newcoll');const n=(i&&i.value||'').trim();if(!n){toast('Escreva um nome para a coleção.');if(i)i.focus();return}const c={id:rid('c'),name:n,gameIds:[]};S.collections.push(c);UI.collEdit=c.id;save();render();window.scrollTo(0,0)},

  dlapp:async()=>{
    toast('1/3 · Juntando a base de jogos…');
    try{let base=null,berr='';try{base=await buildBasePack()}catch(e){berr=String(e&&e.message||e)}
      toast('2/3 · Juntando seus jogos e imagens…');
      const html=standaloneHTML(await buildFullBackup(),base);toast('3/3 · Arquivo pronto ('+(html.length/1048576).toFixed(1)+' MB). Confirme o download.');if(await saveFile('onebit.html',html,'text/html')){toast(base?'App baixado com seus jogos e a base de '+base.catalog.length+' jogos.':'App baixado só com seus jogos. A base falhou: '+berr);return}toast('Baixar arquivos não está disponível aqui.')}
    catch(e){if(e&&e.code==='declined'){toast('Download cancelado.');return}toast('Não consegui baixar: '+(e&&(e.code||e.message)||'erro desconhecido'))}
  },
  doimport:async()=>{
    const raw=UI.pendingImport, media=(raw&&raw.media)||{}; const st=normalize(raw); st.sample=false;
    if(store.mode==='db'){
      toast('Restaurando o backup…');
      const ids=new Set(), map={}; let lost=0;
      Object.values(st.games).forEach(g=>{if(g.coverId)ids.add(g.coverId);g.prints.forEach(p=>ids.add(p))});
      for(const id of ids){
        let ok=false; try{const r=await fetch('/_blob/'+id);ok=r.ok}catch(e){}
        if(ok)continue;
        if(media[id]&&store.assets){try{const b=dataURLtoBlob(media[id]);const r=await store.assets.upload(b,{type:b.type||'image/jpeg'});map[id]=r.id;continue}catch(e){}}
        map[id]=null; lost++;
      }
      Object.values(st.games).forEach(g=>{if(g.coverId&&(g.coverId in map))g.coverId=map[g.coverId];g.prints=g.prints.map(p=>(p in map)?map[p]:p).filter(Boolean)});
      st.media={};
      if(lost)setTimeout(()=>toast(lost+' imagem(ns) do backup não puderam ser restauradas.'),3300);
    }
    S=st;UI.pendingImport=null;UI.confirm=null;applyTheme();save();render();toast('Backup importado.');
  },

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled)return;
  const fn=A[el.dataset.act]; if(fn){e.preventDefault();fn(el)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='bq'){UI.bsearch=t.value;const r=document.getElementById('bresults');if(r)r.innerHTML=baseListHTML();return}
  if(t.dataset.cat&&UI.cat){UI.cat[t.dataset.cat]=t.value;return}
  if(t.dataset.cd&&UI.cat){UI.cat.dlcs[+t.dataset.i][t.dataset.cd]=t.value;return}
  if(t.dataset.ct&&UI.catAch){UI.catAch[UI.catTab||'steam'][+t.dataset.i][t.dataset.ct]=t.value;return}
  if(t.id==='q'){UI.search=t.value;updateResults();return}
  if(t.dataset.pq){UI.progQ=t.value;const g=S.games[UI.gameId],P=progData(g);if(P){const L=P.lists.find(l=>l.id===(UI.progTab||P.lists[0].id))||P.lists[0];document.getElementById('plist').innerHTML=progListHTML(g,P,L)}return}
  if(t.dataset.f&&UI.form){UI.form[t.dataset.f]=t.value;return}
  if(t.dataset.df&&UI.form){const d=UI.form.dlcs[+t.dataset.i];d[t.dataset.df]=t.value;if(t.dataset.df==='kind'||t.dataset.df==='via'){if(d.via)d.owned=true;fixVia(UI.form);render()}return}
  if(t.dataset.tf&&UI.form){UI.form.trophies[+t.dataset.i][t.dataset.tf]=t.value;return}
  if(t.dataset.s){S.settings[t.dataset.s]=t.value;save();return}
  if(t.dataset.cf){const c=S.collections.find(x=>x.id===UI.collEdit);if(c){c.name=t.value||'Sem nome';save()}return}
  if(t.id==='glow'){S.settings.glow=+t.value;applyTheme();const v=document.getElementById('glowv');if(v)v.textContent=t.value+' px';save();return}
  if(t.id==='accentpick'){S.settings.accent=t.value;applyTheme();save();return}
});
async function setCover(file){
  toast('Enviando a capa…');
  try{UI.form.coverId=await uploadImage(file,900);UI.form.coverData=null;$toast.hidden=true;render()}
  catch(err){
    try{const c=await shrink(file,320);UI.form.coverData=c.toDataURL('image/jpeg',.72);UI.form.coverId=null;$toast.hidden=true;render();if(!(err&&err.code==='no_assets'))toast('Capa salva em tamanho menor ('+((err&&err.code)||'envio falhou')+'). Toque em Salvar.')}
    catch(x){toast('Não consegui abrir essa imagem. Tente outra foto.')}
  }
}
async function addPrint(file){
  if(!store.assets&&store.mode!=='db'){try{const c=await shrink(file,1280);const id=rid('m');S.media=S.media||{};S.media[id]=c.toDataURL('image/jpeg',.8);UI.form.prints.push(id);render()}catch(x){toast('Não consegui abrir essa imagem.')}return}
  toast('Enviando o print…');
  try{const id=await uploadImage(file,1600);UI.form.prints.push(id);$toast.hidden=true;render()}catch(err){assetErr(err)}
}
document.addEventListener('paste',async e=>{
  const t=e.target; if(!t||(t.id!=='coverpaste'&&t.id!=='printpaste')||!UI.form)return;
  const items=(e.clipboardData&&e.clipboardData.items)||[]; let file=null;
  for(let i=0;i<items.length;i++){const it=items[i];if(it.kind==='file'&&/^image\//.test(it.type)){file=it.getAsFile();break}}
  e.preventDefault(); t.value='';
  if(!file){toast('Não encontrei uma imagem para colar. Copie a foto primeiro.');return}
  if(t.id==='coverpaste')await setCover(file); else await addPrint(file);
});
function takeBackupText(txt){
  let raw=null; try{raw=JSON.parse(String(txt||'').trim())}catch(e){}
  if(!raw||typeof raw.games!=='object'){toast('Isso não parece um backup do One Bit.');return false}
  UI.pendingImport=raw;UI.confirm='import';UI.view='ajustes';render();window.scrollTo(0,document.body.scrollHeight);return true;
}
document.addEventListener('paste',e=>{
  const t=e.target; if(!t||t.id!=='importpaste')return;
  e.preventDefault();
  const cd=e.clipboardData; const f=cd&&cd.files&&cd.files[0];
  if(f){f.text().then(takeBackupText).catch(()=>toast('Não consegui ler esse arquivo.'));return}
  takeBackupText(cd?cd.getData('text'):'');
});
document.addEventListener('dragover',e=>{if(UI.view==='ajustes')e.preventDefault()});
document.addEventListener('drop',e=>{
  if(UI.view!=='ajustes')return; e.preventDefault();
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f)f.text().then(takeBackupText).catch(()=>toast('Não consegui ler esse arquivo.'));
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='accentpick'){render();return}
  if(t.dataset.tf==='type'&&UI.form){UI.form.trophies[+t.dataset.i].type=t.value;return}
  const file=t.files&&t.files[0]; if(!file)return;
  if(t.id==='catcover'){await setCatCover(file);t.value='';return}
  if(t.id==='coverfile'){
    toast('Enviando a capa…');
    try{UI.form.coverId=await uploadImage(file,900);UI.form.coverData=null;$toast.hidden=true;render()}
    catch(err){
      try{const c=await shrink(file,320);UI.form.coverData=c.toDataURL('image/jpeg',.72);UI.form.coverId=null;$toast.hidden=true;render();if(!(err&&err.code==='no_assets'))toast('Capa salva em tamanho menor ('+((err&&err.code)||'envio falhou')+'). Toque em Salvar.')}
      catch(x){toast('Não consegui abrir essa imagem. Tente outra foto.')}
    }
  }else if(t.id==='printfile'){
    await addPrint(file);
  }else if(t.id==='importfile'){
    try{const raw=JSON.parse(await file.text());if(!raw||typeof raw.games!=='object')throw 0;UI.pendingImport=raw;UI.confirm='import';render()}
    catch(x){toast('Esse arquivo não é um backup do One Bit.')}
  }
  t.value='';
});

boot();
